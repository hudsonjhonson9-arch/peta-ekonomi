<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARSIP DIGITAL BAPPERIDA — BAPPERIDA Sumba Barat</title>
    <meta name="description" content="Arsip digital Bapperida Kabupaten Sumba Barat — pengelolaan dokumen perencanaan pembangunan daerah, kertas kerja, dan standar harga." />
    <meta property="og:title" content="ARSIP DIGITAL BAPPERIDA — BAPPERIDA Sumba Barat" />
    <meta property="og:description" content="Pengelolaan dokumen perencanaan pembangunan daerah, kertas kerja, dan standar harga." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-variant-numeric: tabular-nums;
        -webkit-tap-highlight-color: transparent;
      }
      #root { display: flex; flex-direction: column; width: 100%; min-height: 100vh; min-height: 100dvh; }
      @media (max-width: 767px) {
        body { font-size: 15px; }
      }
      /* Scrollbar modern dan ramping untuk seluruh aplikasi */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.35); border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.6); }
      html[data-theme="dark"] ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); }
      html[data-theme="dark"] ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.35); }

      /* Sembunyikan scrollbar sepenuhnya pada sidebar navigasi sesuai permintaan */
      .sidebar-nav, .no-scrollbar {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      .sidebar-nav::-webkit-scrollbar, .no-scrollbar::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      @media (min-width: 768px) {
        .mobile-only { display: none !important; }
      }
      @media (max-width: 767px) {
        .desktop-only { display: none !important; }
      }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
      @keyframes slideDown { from { transform: translateY(0); } to { transform: translateY(100%); } }
      [data-pegang] { touch-action: none; cursor: grab; user-select: none; }
      [data-seret] [data-pegang] { cursor: grabbing; }
      /* Focus keyboard selalu terlihat (banyak tombol inline memakai outline:none). */
      *:focus-visible { outline: 2px solid #2563EB !important; outline-offset: 2px; }
      html[data-theme="dark"] *:focus-visible { outline: #60A5FA !important; }
      /* Umpan balik tekan pada semua tombol. */
      @keyframes spin { to { transform: rotate(360deg); } }
      button { transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease, color .15s ease, transform .12s ease, filter .15s ease; }
      button:hover:not(:disabled) { filter: brightness(1.04); }
      input[type="file"]::file-selector-button {
        font-family: inherit; font-weight: 600; font-size: 12px;
        padding: 7px 14px; border-radius: 8px; border: 1px solid #2563EB;
        background: #EFF6FF; color: #2563EB; cursor: pointer;
        margin-right: 10px; transition: all .15s ease;
      }
      input[type="file"]::file-selector-button:hover { background: #2563EB; color: #fff; }
      html[data-theme="dark"] input[type="file"]::file-selector-button {
        background: rgba(59,130,246,0.15); color: #60A5FA; border-color: #3B82F6;
      }
      button:active:not(:disabled) { transform: scale(0.97); }
      h1, h2, h3 { text-wrap: balance; }
      /* Tautan "lewati ke konten" — muncul hanya saat difokus keyboard. */
      .skip-link {
        position: fixed; top: -64px; left: 16px; z-index: 2000;
        background: #2563EB; color: #fff; padding: 10px 16px;
        border-radius: 8px; font-size: 13px; font-weight: 600;
        text-decoration: none; transition: top .15s ease;
      }
      .skip-link:focus { top: 12px; }
      html[data-theme="dark"] {
        color-scheme: dark;
      }
      html[data-theme="dark"] body {
        background: #0F172A;
        color: #F1F5F9;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
